<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
	<title>FretField</title>
	<!-- Field Matrix mark (visual-rebrand spec, direction 2): an abstract
	     grid, evoking fretboard, sequencer, harmonic field, and coordinate
	     system all at once, rather than a literal instrument drawing. One
	     red node marks the currently active musical event; its position (an
	     internal intersection, not the center or a corner) is deliberate,
	     not decorative. Same construction as favicon.svg/logo-banner.svg,
	     just scaled: one mark, three sizes. -->
	<rect width="240" height="240" rx="32" fill="#E3AC18" />
	<g stroke="#151411" stroke-width="6" stroke-linecap="square">
		<line x1="48" y1="48" x2="48" y2="192" />
		<line x1="96" y1="48" x2="96" y2="192" />
		<line x1="144" y1="48" x2="144" y2="192" />
		<line x1="192" y1="48" x2="192" y2="192" />
		<line x1="48" y1="48" x2="192" y2="48" />
		<line x1="48" y1="96" x2="192" y2="96" />
		<line x1="48" y1="144" x2="192" y2="144" />
		<line x1="48" y1="192" x2="192" y2="192" />
	</g>
	<circle cx="144" cy="96" r="11" fill="#E34832" />
</svg>
