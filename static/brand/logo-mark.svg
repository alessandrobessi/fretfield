<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
	<title>FretField</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#7c3aed" />
			<stop offset="55%" stop-color="#a855f7" />
			<stop offset="100%" stop-color="#ec4899" />
		</linearGradient>
	</defs>

	<rect width="240" height="240" rx="52" fill="url(#bg)" />

	<!-- nut -->
	<line x1="40" y1="60" x2="40" y2="198" stroke="#fff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" />
	<!-- frets -->
	<g stroke="#fff" stroke-opacity="0.3" stroke-width="2">
		<line x1="76" y1="60" x2="76" y2="198" />
		<line x1="112" y1="60" x2="112" y2="198" />
		<line x1="148" y1="60" x2="148" y2="198" />
		<line x1="184" y1="60" x2="184" y2="198" />
	</g>
	<!-- strings: G (top, thinnest) to E (bottom, thickest) -->
	<g stroke="#fff" stroke-opacity="0.55" stroke-linecap="round">
		<line x1="40" y1="78" x2="200" y2="78" stroke-width="2" />
		<line x1="40" y1="112" x2="200" y2="112" stroke-width="2.5" />
		<line x1="40" y1="146" x2="200" y2="146" stroke-width="3" />
		<line x1="40" y1="180" x2="200" y2="180" stroke-width="3.5" />
	</g>

	<!-- root: the dominant mark, anchoring the field -->
	<circle cx="112" cy="146" r="20" fill="#f59e0b" stroke="#fff" stroke-width="2.5" />
	<!-- structural -->
	<circle cx="184" cy="78" r="15" fill="#4f46e5" stroke="#fff" stroke-width="2.5" />
	<!-- stable -->
	<circle cx="184" cy="180" r="12" fill="#fff" />
	<circle cx="184" cy="180" r="12" fill="none" stroke="#10b981" stroke-width="4" />
	<!-- color -->
	<circle cx="76" cy="78" r="8" fill="none" stroke="#ec4899" stroke-width="3.5" />
</svg>
