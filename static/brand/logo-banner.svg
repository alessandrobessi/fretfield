<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
	<title>FretField — See the harmonic field. Move through it.</title>
	<!-- Field Matrix mark (visual-rebrand spec, direction 2) -- see
	     logo-mark.svg for the construction note. Drawn directly onto the
	     banner's own yellow field rather than as a separate badge. -->
	<rect width="1200" height="300" rx="40" fill="#E3AC18" />

	<g stroke="#151411" stroke-width="7" stroke-linecap="square">
		<line x1="70" y1="60" x2="70" y2="240" />
		<line x1="130" y1="60" x2="130" y2="240" />
		<line x1="190" y1="60" x2="190" y2="240" />
		<line x1="250" y1="60" x2="250" y2="240" />
		<line x1="70" y1="60" x2="250" y2="60" />
		<line x1="70" y1="120" x2="250" y2="120" />
		<line x1="70" y1="180" x2="250" y2="180" />
		<line x1="70" y1="240" x2="250" y2="240" />
	</g>
	<circle cx="190" cy="120" r="13" fill="#E34832" />

	<text
		x="310"
		y="175"
		font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
		font-size="96"
		font-weight="800"
		letter-spacing="-2"
		fill="#151411"
	>FretField</text>
	<text
		x="313"
		y="216"
		font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
		font-size="28"
		font-weight="600"
		fill="#151411"
		fill-opacity="0.75"
	>See the harmonic field. Move through it.</text>
</svg>
