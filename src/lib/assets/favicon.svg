<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<title>FretField</title>
	<!-- Field Matrix mark (visual-rebrand spec, direction 2): an abstract
	     grid, evoking fretboard, sequencer, harmonic field, and coordinate
	     system all at once, rather than a literal instrument drawing. One
	     red node marks the currently active musical event. -->
	<rect width="64" height="64" rx="14" fill="#E3AC18" />
	<g stroke="#151411" stroke-width="2.25" stroke-linecap="square">
		<line x1="8" y1="8" x2="8" y2="56" />
		<line x1="24" y1="8" x2="24" y2="56" />
		<line x1="40" y1="8" x2="40" y2="56" />
		<line x1="56" y1="8" x2="56" y2="56" />
		<line x1="8" y1="8" x2="56" y2="8" />
		<line x1="8" y1="24" x2="56" y2="24" />
		<line x1="8" y1="40" x2="56" y2="40" />
		<line x1="8" y1="56" x2="56" y2="56" />
	</g>
	<circle cx="40" cy="24" r="3.4" fill="#E34832" />
</svg>
