<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<title>FretField</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#7c3aed" />
			<stop offset="55%" stop-color="#a855f7" />
			<stop offset="100%" stop-color="#ec4899" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="16" fill="url(#bg)" />
	<!-- root: the dominant mark, anchoring the field -->
	<circle cx="25" cy="38" r="13" fill="#f59e0b" stroke="#fff" stroke-width="1.75" />
	<!-- structural -->
	<circle cx="45" cy="22" r="9" fill="#4f46e5" stroke="#fff" stroke-width="1.75" />
	<!-- stable -->
	<circle cx="47" cy="47" r="7" fill="#fff" />
	<circle cx="47" cy="47" r="7" fill="none" stroke="#10b981" stroke-width="3" />
</svg>
